name: Mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/domain/**'
      - 'src/application/document-store.ts'
      - 'scripts/**'
      - 'stryker.conf.json'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

jobs:
  stryker:
    name: Full Stryker Mutation Run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full Stryker mutation run
        run: npm run mutation:stryker
