name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 26
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }} LTS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Host & 5-Bundle Client Chunks
        run: npm run build

      - name: Run Test Suite (including Packaging & Lifecycle Gates)
        run: npm test

      - name: Verify Bundle Budgets
        run: npm run budget

      - name: Verify npm Tarball Contents
        run: npm pack --dry-run

  quality-and-browser:
    name: Quality, Mutation & Browser Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Bundled Third-Party License Inventory Gate
        run: npm run licenses:check

      - name: Install Chromium for Headless Smoke
        run: npx playwright install --with-deps chromium

      - name: Coverage, CRAP <= 30 & Bundle Budget Gate
        run: npm run quality

      - name: Deterministic Mutation Smoke Gate
        run: npm run mutation

      - name: Browser Smoke & axe-core Accessibility Audit
        run: npm run test:browser
